services:
  postgres:
    image: postgres:16-alpine
    container_name: struxora-postgres
    environment:
      POSTGRES_USER: struxora
      POSTGRES_PASSWORD: struxora
      POSTGRES_DB: struxora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U struxora -d struxora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
